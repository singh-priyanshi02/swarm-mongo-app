
name: Build Scan and Push

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Docker
        run: |
          docker --version
          docker ps

      - name: Build Docker Image
        run: |
          docker build -t swarm-mongo-app:${{ github.sha }} .

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: swarm-mongo-app:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image to GHCR
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/swarm-mongo-app"

          docker tag swarm-mongo-app:${{ github.sha }} $IMAGE:${{ github.sha }}
          docker tag swarm-mongo-app:${{ github.sha }} $IMAGE:latest

          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
